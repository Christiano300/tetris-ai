[package]
name = "env"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "env"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.27.0"
rand = "0.10.0"
tetris-core = { git = "https://github.com/Christiano300/wasm-tetris.git" }
serde_cbor = "0.11.1"
serde = { version = "1.0.217", features = ["derive"] }
